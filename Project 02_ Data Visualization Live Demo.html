function legend(d){const c=cols();$("leg").innerHTML=d.groups.length>1?d.groups.map((g,i)=>`<span><i style="background:${c[i]}"></i>${g}</span>`).join(""):""}
function render(){
 const d=D[ds],view=$("view").value,c=cols(),x=+$("fx").value,y=+$("fy").value;
 const ink=cs("--ink"),line=cs("--line"),mut=cs("--mut");
 if(chart){chart.destroy();chart=null}
 $("lfy").hidden=view!=="scatter";$("fx").parentElement.hidden=view==="corr";
 $("cv").hidden=view==="corr";$("hm").hidden=view!=="corr";
 legend(d);
 Chart.defaults.color=mut;Chart.defaults.font.family='"IBM Plex Sans",system-ui,sans-serif';
 const axis=t=>({title:{display:true,text:t,color:mut},grid:{color:line}});
 if(view==="hist"){
  const v=colv(d,x),lo=Math.min(...v),hi=Math.max(...v),n=18,w=(hi-lo)/n||1;
  const sets=d.groups.map((g,gi)=>{const a=Array(n).fill(0);d.rows.forEach(r=>{if(r[0]===gi){a[Math.min(n-1,Math.floor((r[x+1]-lo)/w))]++}});return{label:g,data:a,backgroundColor:c[gi],borderWidth:0}});
  chart=new Chart($("c"),{type:"bar",data:{labels:Array.from({length:n},(_,i)=>(lo+w*i).toFixed(2)),datasets:sets},options:{maintainAspectRatio:false,scales:{x:{...axis(d.feats[x]),stacked:true,grid:{display:false}},y:{...axis("Count"),stacked:true}},plugins:{legend:{display:false}},animation:{duration:250}}});
  const m=v.reduce((s,a)=>s+a,0)/v.length;
  $("note").textContent=`${d.feats[x]} ranges from ${lo.toFixed(2)} to ${hi.toFixed(2)} with a mean of ${m.toFixed(2)}.`;
 }else if(view==="scatter"){
  const sets=d.groups.map((g,gi)=>({label:g,data:d.rows.filter(r=>r[0]===gi).map(r=>({x:r[x+1],y:r[y+1]})),backgroundColor:c[gi]+"cc",pointRadius:4}));
  chart=new Chart($("c"),{type:"scatter",data:{datasets:sets},options:{maintainAspectRatio:false,scales:{x:axis(d.feats[x]),y:axis(d.feats[y])},plugins:{legend:{display:false}},animation:{duration:250}}});
  const r=corr(colv(d,x),colv(d,y));
  $("note").textContent=`Correlation between ${d.feats[x]} and ${d.feats[y]}: ${r.toFixed(2)}.`;
 }else{
  const F=d.feats,n=F.length,V=F.map((_,j)=>colv(d,j));
  const head="<tr><th></th>"+F.map(f=>`<th>${f.replace(/_/g," ")}</th>`).join("")+"</tr>";
  let body="";
  for(let i=0;i<n;i++){body+=`<tr><th>${F[i].replace(/_/g," ")}</th>`;for(let j=0;j<n;j++){const r=corr(V[i],V[j]),a=Math.abs(r),base=r>=0?"29,78,216":"190,18,60";body+=`<td tabindex="0" data-i="${i}" data-j="${j}" style="background:rgba(${base},${(a*.9).toFixed(2)});color:${a>.55?"#fff":ink}" title="${F[i]} vs ${F[j]}">${r.toFixed(2)}</td>`}body+="</tr>"}
  $("hm").innerHTML=`<table>${head}${body}</table>`;
  $("note").textContent="Blue cells move together, red cells move in opposite directions. Click a cell to see that pair as a scatter plot.";
 }
}
$("hm").addEventListener("click",e=>{const t=e.target.closest("td");if(!t)return;$("view").value="scatter";$("fx").value=t.dataset.i;$("fy").value=t.dataset.j;render()});
$("hm").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.click()});
["view","fx","fy"].forEach(i=>$(i).addEventListener("change",render));
$("tabs").innerHTML=Object.keys(D).map(k=>`<button class="tab" aria-pressed="${k===ds}" data-k="${k}">${k}</button>`).join("");
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;ds=b.dataset.k;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed",t===b));setup()});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
setup();
</script></body></html>
